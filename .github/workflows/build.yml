name: Build and Test
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==24.0"
          pip install --only-binary :all: -r requirements.lock.txt
      
      - name: Run tests with coverage
        env:
          TESTING: 'True'
        run: |
          echo "Running tests with coverage..."
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term
          
          echo "Coverage Summary:"
          python -m coverage report
          
          echo "Generated coverage files:"
          ls -la coverage.xml || echo "coverage.xml not found"
          ls -la htmlcov/ || echo "htmlcov/ not found"

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.0
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.3
        with:
          name: coverage-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Estadio-do-Dragao-app_Congestion-Service
            -Dsonar.organization=fanapp-estadio-dragao
            -Dsonar.sources=.
            -Dsonar.exclusions=tests/**,**/__pycache__/**,**/*.pyc,mosquitto/**,**/*.log,coverage.xml,htmlcov/**,*.yml,*.yaml,Dockerfile,main.py
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scm.provider=git
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.python.version=3.11
